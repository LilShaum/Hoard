# Builds Hoard and publishes it to GitHub Pages.
#
# The site is served from a repository sub-path, so the build needs to know
# that path up front — hence `configure-pages` running before the build and
# feeding its `base_path` output in as PAGES_BASE.
#
# Routing is hash-based, so no 404 fallback is needed: every route is a
# fragment of one document.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/friends-app-project-gc3crq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The sub-path is just the repository name, so it is derived here rather
      # than taken from configure-pages. That keeps the build — and the tests
      # above it — meaningful even before Pages has been switched on.
      - name: Build
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # A no-op once Pages is on. It cannot switch Pages on by itself
          # unless the repository allows the Actions token to do so — if this
          # step fails with "Resource not accessible by integration", enable
          # Pages once by hand: Settings -> Pages -> Source: GitHub Actions.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
