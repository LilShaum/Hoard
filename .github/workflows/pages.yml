# Builds Hoard and publishes it to GitHub Pages.
#
# The site is served from a repository sub-path, so the build needs to know
# that path up front — hence `configure-pages` running before the build and
# feeding its `base_path` output in as PAGES_BASE.
#
# Routing is hash-based, so no 404 fallback is needed: every route is a
# fragment of one document.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/hoard-gc3crq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The sub-path is just the repository name, so it is derived here rather
      # than taken from configure-pages. That keeps the build — and the tests
      # above it — meaningful even before Pages has been switched on.
      - name: Build
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      # The browser suite had never run here — only the unit tests had — so
      # every deploy went out on the word of a run on somebody's machine. It
      # runs against the built sub-path site, which is the exact shape Pages
      # serves, because that is where a wrong base path shows up and nowhere
      # else. `vite preview` needs the same PAGES_BASE as the build: without
      # it, preview serves at / while index.html asks for /<repo>/assets, the
      # script 404s and the page comes up blank.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser suite against the built site
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:4173${PAGES_BASE}" && break
            sleep 1
          done
          BASE="http://127.0.0.1:4173${PAGES_BASE}" node scripts/e2e.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # A no-op once Pages is on. It cannot switch Pages on by itself
          # unless the repository allows the Actions token to do so — if this
          # step fails with "Resource not accessible by integration", enable
          # Pages once by hand: Settings -> Pages -> Source: GitHub Actions.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Only the default branch may deploy: enabling Pages restricts the
  # github-pages environment to it, so attempting a deploy from a working
  # branch is rejected outright and leaves that branch permanently red. Every
  # other branch still gets the full typecheck, test and build above as a
  # normal CI check, and can go green on its own.
  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
