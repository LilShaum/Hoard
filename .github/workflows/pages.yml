# Builds Hoard and publishes it to GitHub Pages.
#
# The site is served from a repository sub-path, so the build needs to know
# that path up front — hence `configure-pages` running before the build and
# feeding its `base_path` output in as PAGES_BASE.
#
# Routing is hash-based, so no 404 fallback is needed: every route is a
# fragment of one document.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/friends-app-project-gc3crq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not already enabled.
          enablement: true

      - name: Build
        run: npm run build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
